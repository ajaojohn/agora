<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Agora</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }
    html, body, #root {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }
    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .empty, .loading, .error {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .empty h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 500;
    }
    .empty p, .loading p, .error p {
      margin: 0;
      color: #888;
      font-size: 14px;
    }
    button {
      padding: 8px 16px;
      font-size: 14px;
      border-radius: 6px;
      border: 1px solid #888;
      background: transparent;
      color: inherit;
      cursor: pointer;
    }
    button:hover { background: rgba(128, 128, 128, 0.1); }
    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid rgba(128, 128, 128, 0.25);
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-message {
      max-width: 480px;
      text-align: center;
      color: #c33;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 12px;
    }
    /* Placeholder where the WebContentsView renders. The view is layered on
       top by Electron's main process; this div just reserves the bounds. */
    .view-host {
      flex: 1;
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
